name: neo-workflows

# Overlay con GPU para neo-model. Probado en esta máquina (RTX 4060, 8GB):
# `docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu24.04 nvidia-smi`
# la ve bien. Sin esto, OneJev-0.8B corre en CPU (lento, pero funciona para
# las Fases 0-1); desde la Fase 2 se recomienda GPU, y la Fase 3
# (fine-tuning) sí la necesita.
services:
  neo-model:
    environment:
      NEO_MODEL_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

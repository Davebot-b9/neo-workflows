[project]
name = "neo-model"
version = "0.1.0"
description = "neo-model: inferencia System One y fine-tuning LoRA, servido por gRPC"
requires-python = "==3.12.9"
dependencies = [
    "grpcio==1.85.1",
    "grpcio-tools==1.85.1",
    "grpcio-health-checking==1.85.1",
    "protobuf==7.36.2",
]

# Fase 2/3: una vez elegido el modelo System One (pregunta abierta con Oscar),
# se agregan aquí torch + transformers + peft con versión fija, compatible con
# la GPU objetivo. No se instalan en la Fase 0.

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[project]
name = "neo-model"
version = "0.1.0"
description = "neo-model: inferencia System One y fine-tuning LoRA, servido por gRPC"
requires-python = "==3.12.9"
dependencies = [
    "grpcio==1.85.1",
    "grpcio-tools==1.85.1",
    "grpcio-health-checking==1.85.1",
    "protobuf==7.36.2",
    # Fase 2: OneJev-0.8B (System One abierto, Apache 2.0) vía qev.
    # Instalado desde git, fijado a un commit (no hay release en PyPI con
    # este nombre: el "qev" de PyPI es un proyecto distinto, no relacionado).
    "qev[torch] @ git+https://github.com/OmniJev/OneJev.git@31678bc3ad1c980a9e416e4902cd2e4c8ffc02f5",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    # Fase 3: LoRA real sobre el mismo modelo (ver model/neo_model/train/lora.py).
    "peft==0.21.2",
    # Fase 4: trazas distribuidas, exportadas por OTLP/gRPC a Jaeger (igual
    # que neo-api y neo-vector). GrpcInstrumentorServer extrae el
    # traceparent entrante y crea el span por RPC automáticamente.
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-grpc==0.66b2",
    "opentelemetry-semantic-conventions==0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[package]
name = "neo-vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[[bin]]
name = "neo-vector"
path = "src/main.rs"

[dependencies]
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-health = "0.14.9"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
protobuf-src = "2.1.1"

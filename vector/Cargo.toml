[package]
name = "neo-vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[[bin]]
name = "neo-vector"
path = "src/main.rs"

[dependencies]
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-health = "0.14.9"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fastembed = "7.6.1"
usearch = "2.26.6"
rayon = "1.12.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34.0"

[build-dependencies]
tonic-prost-build = "0.14.9"
protobuf-src = "2.1.1"

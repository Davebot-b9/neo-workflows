# nginx de web: sirve el build de Vite y hace proxy a neo-api.

# DNS interno de Docker. Resolver por petición (variable en proxy_pass) evita
# que nginx se quede con la IP vieja cuando neo-api se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # text/event-stream queda fuera a propósito: comprimir SSE lo bufferiza.

    set $neo_api http://neo-api:8080;

    # SSE (GET /api/runs/{id}/events, /api/jobs/{id}/events) y comandos HTTP.
    location /api/ {
        proxy_pass $neo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin búfer: cada evento SSE llega al navegador en cuanto Go hace Flush.
        proxy_buffering off;
        proxy_cache off;
        # Un fine-tuning puede tardar minutos con el stream abierto.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /healthz {
        proxy_pass $neo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Assets con hash en el nombre: caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA con router por hash: todo lo demás es index.html, sin caché.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

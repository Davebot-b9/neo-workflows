name: neo-workflows

# Arranque esperado:
#   docker compose up                                        (sin GPU; neo-model en CPU, lento)
#   docker compose -f compose.yaml -f compose.gpu.yaml up     (con GPU; recomendado desde la Fase 2)
#
# `web` (front/) también corre aquí: nginx sirve el build y hace proxy de
# /api y /healthz a neo-api → http://localhost:5173. Para desarrollar con
# recarga en caliente sigue sirviendo `npm run dev` en front/ (si el 5173 está
# ocupado por el contenedor, Vite toma el siguiente puerto libre).

services:
  jaeger:
    # Fase 4: colector OTLP (gRPC 4317, HTTP 4318) + UI (16686) en un solo
    # contenedor. El front manda sus spans directo por OTLP/HTTP desde el
    # navegador, por eso necesita CORS abierto (es un dev local, no expuesto).
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "*"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_HEADERS: "*"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neo}
      POSTGRES_DB: ${POSTGRES_DB:-neo}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ guarda los datos en un subdirectorio por versión mayor
      # dentro de /var/lib/postgresql; montar en .../data (convención <18)
      # lo deja en un estado inconsistente al arrancar.
      - neo-postgres-data:/var/lib/postgresql
      - ./back/internal/ledger/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neo} -d ${POSTGRES_DB:-neo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo-vector:
    build:
      context: .
      dockerfile: vector/Dockerfile
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      NEO_VECTOR_INDEX_IMPL: ${NEO_VECTOR_INDEX_IMPL:-usearch}
      NEO_VECTOR_CAPACITY: ${NEO_VECTOR_CAPACITY:-100000}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      # El modelo de embeddings (~470MB) se baja una vez de Hugging Face y se
      # cachea aquí; sin esto, cada recreate del contenedor lo vuelve a bajar.
      - neo-vector-model-cache:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50051", "-service=neo.v1.VectorService"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  neo-model:
    build:
      context: ./model
    restart: unless-stopped
    ports:
      - "50052:50052"
    environment:
      NEO_MODEL_DEVICE: ${NEO_MODEL_DEVICE:-cpu}
      # qev.DecisionEngine no acepta un revision fijo (ver CLAUDE.md): esto
      # siempre carga la rama main del repo en Hugging Face, no un commit
      # pinneado. Limitación conocida de la librería, no decisión nuestra.
      NEO_MODEL_PATH: ${NEO_MODEL_PATH:-OmniJev/OneJev-0.8B}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      # El modelo (~2.2GB) se baja una vez de Hugging Face y se cachea aquí;
      # sin esto, cada recreate del contenedor lo vuelve a bajar. También
      # guarda ahí los adaptadores LoRA que entrena la Fase 3 (/data/adapters).
      - neo-model-cache:/data
      # Datasets sintéticos para fine-tuning (Fase 3), sin copiarlos a la imagen.
      - ./data/generated:/datasets:ro
      # El comparador de calibración antes/después (Fase 3) escribe su
      # reporte aquí, directo al bench/ del repo.
      - ./bench:/bench
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50052", "-service=neo.v1.ModelService"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  neo-api:
    build:
      context: ./back
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NEO_HTTP_ADDR: ":8080"
      NEO_VECTOR_ADDR: "neo-vector:50051"
      NEO_MODEL_ADDR: "neo-model:50052"
      NEO_DATABASE_URL: postgres://${POSTGRES_USER:-neo}:${POSTGRES_PASSWORD:-neo}@postgres:5432/${POSTGRES_DB:-neo}?sslmode=disable
      NEO_WORKFLOWS_DIR: /app/workflows
      JEV_API_KEY: ${JEV_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      - ./workflows:/app/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo-vector:
        condition: service_healthy
      neo-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/neo", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./front
    restart: unless-stopped
    ports:
      - "${NEO_WEB_PORT:-5173}:80"
    depends_on:
      # Solo que exista: nginx resuelve neo-api por petición, así que web
      # arranca aunque neo-api tarde (y la UI muestra el estado en vivo).
      - neo-api

volumes:
  neo-postgres-data:
  neo-vector-model-cache:
  neo-model-cache:
